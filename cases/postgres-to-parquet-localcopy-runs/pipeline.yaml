pipeline:
  name: postgres-to-parquet-localcopy-runs

source:
  type: postgres
  config:
    host: pg
    port: 5432
    dbname: lab
    user: lab
    password: lab
    query: "SELECT * FROM spacecraft_telemetry_events"
    batch_size: 2000
    incremental:
      cursor_column: event_sequence

state:
  backend: local
  path: /output/state.json

destination:
  type: parquet
  config:
    prefix: events
    compression: snappy
    max_file_size: "512KiB"

sink:
  type: local-copy
  config:
    dest: /output/delivered
