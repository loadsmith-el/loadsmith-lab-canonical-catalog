pipeline:
  name: postgres-to-s3-parquet

source:
  type: postgres
  config:
    host: pg
    port: 5432
    dbname: lab
    user: lab
    password: lab
    query: "SELECT * FROM spacecraft_telemetry_events ORDER BY event_sequence"
    batch_size: 5000

# No `path`: the core stages the file in a scratch dir and the sink delivers it.
destination:
  type: parquet
  config:
    prefix: events
    compression: snappy

sink:
  type: s3
  config:
    endpoint: http://s3:9000
    bucket: lake
    region: us-east-1
    access_key_id: lab
    secret_access_key: labsecret12345
    prefix: raw/events
    # Smallest S3 part size: the ~10 MiB file goes up as a multipart upload.
    part_size_mib: 5
