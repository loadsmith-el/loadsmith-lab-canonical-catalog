case:
  name: oracle-to-jsonl-parallel
  description: >
    A partitioned full load (oracle `parallel: {workers: 4}`): four connections
    read ROWID ranges of the telemetry table at one SCN, through an alias and a
    filter (event_sequence <= 60000). Every row exactly once: the output holds
    the 60,000 filtered rows, no duplicate and none missing.
  tags: [oracle, jsonl, parallel]

services:
  - image: images/lab-oracle
    alias: oracle
    readiness:
      tcp: 1521
      timeout_seconds: 600   # Oracle is slow to open the PDB + load the seed
      oracle:
        service_name: FREEPDB1
        user: lab
        password: lab
        probe_query: "SELECT 1 FROM spacecraft_telemetry_events WHERE ROWNUM = 1"

pipeline:
  file: pipeline.yaml

expect:
  status: success
  rows_read: 60000
  rows_written: 60000
  output:
    file: events.jsonl
    row_count: 60000
