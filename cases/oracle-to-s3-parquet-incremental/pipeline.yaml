pipeline:
  name: oracle-to-s3-parquet-incremental

source:
  type: oracle
  config:
    host: oracle
    port: 1521
    service_name: FREEPDB1
    user: lab
    password: lab
    query: "SELECT * FROM spacecraft_telemetry_events"
    batch_size: 5000
    incremental:
      cursor_column: event_sequence
      initial_value: "0"

# The watermark lives in the run's output dir, which the lab keeps across the
# case's runs.
state:
  backend: local
  path: /output/state/oracle-to-s3-parquet-incremental.json

destination:
  type: parquet
  config:
    prefix: events
    compression: snappy
    max_file_size: "2MiB"

sink:
  type: s3
  config:
    endpoint: http://s3:9000
    bucket: lake
    region: us-east-1
    access_key_id: lab
    secret_access_key: labsecret12345
    prefix: raw/oracle-events
