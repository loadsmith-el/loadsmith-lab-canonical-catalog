case:
  name: oracle-to-oracle-staged-merge
  description: >
    Loads 100k rows into Oracle via staged_merge — array INSERT into a
    session-private global temporary staging table, then one set-based
    `MERGE INTO events_sink USING` the staging table keyed by id. Exercises the
    idempotent upsert path against a real Oracle; asserts every row committed.
  tags: [oracle, destination, staged-merge, smoke]

services:
  - image: images/lab-oracle
    alias: oracle
    readiness:
      tcp: 1521
      timeout_seconds: 600
      oracle:
        service_name: FREEPDB1
        user: lab
        password: lab
        # Gate on the LAST object init.sql creates (the events_sink PK), not just
        # the seeded source table — the seed COMMIT becomes visible several
        # statements (index builds) before events_sink exists, so a source-only
        # probe races the destination table into existence.
        probe_query: "SELECT 1 FROM user_constraints WHERE constraint_name = 'PK_SINK'"

pipeline:
  file: pipeline.yaml

expect:
  status: success
  rows_read: 100000
  rows_written: 100000
