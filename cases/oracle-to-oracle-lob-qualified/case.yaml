case:
  name: oracle-to-oracle-lob-qualified
  description: >
    oracle-to-oracle-lob with a schema-qualified target (`lab.lob_roundtrip_sink`,
    quoted part by part) and CLOBs longer than 4000 bytes (8000+ characters,
    built in the query) read whole and bound back into the CLOB column.
  tags: [oracle, destination, lob]

services:
  - image: images/lab-oracle
    alias: oracle
    readiness:
      tcp: 1521
      timeout_seconds: 600
      oracle:
        service_name: FREEPDB1
        user: lab
        password: lab
        # Gate on the LAST object init.sql creates (the LOB sink PK), so the
        # fixture is fully built before the case connects.
        probe_query: "SELECT 1 FROM user_constraints WHERE constraint_name = 'PK_LOB_SINK'"

pipeline:
  file: pipeline.yaml

expect:
  status: success
  rows_read: 3
  rows_written: 3
