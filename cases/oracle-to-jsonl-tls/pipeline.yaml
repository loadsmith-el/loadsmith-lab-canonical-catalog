pipeline:
  name: oracle-to-jsonl-tls
  description: Telemetry export over TCPS (fully verified) — oracledb rustls TLS

# TLS uses the canon's shared `tls` block. The oracledb thin driver always
# verifies the chain AND the host name, so `verify-full` is the mode that runs
# TLS (prefer/require/verify-ca are rejected). The lab CA is mounted at /tls and
# inlined with file(); the lab leaf cert's SAN includes the alias "oracle".

source:
  type: oracle
  config:
    host: oracle
    port: 2484               # stunnel TLS terminator → plaintext TNS on 1521
    service_name: FREEPDB1
    user: lab
    password: lab
    query: "SELECT * FROM spacecraft_telemetry_events ORDER BY event_sequence"
    batch_size: 2000
    tls:
      mode: verify-full
      root_cert: "{{ file('/tls/ca.crt') }}"   # the lab CA (PEM)

destination:
  type: jsonl
  config:
    path: /output/events.jsonl
