pipeline:
  name: csv-to-postgres

source:
  type: file
  config:
    path: /data
    glob: "part-*.csv"

parser:
  type: csv
  config:
    delimiter: ";"
    encoding: windows-1252
    header: true
    columns:
      - { name: id,             type: int32, nullable: false }
      - { name: c_int8,         type: int64 }
      - { name: c_float8,       type: float64 }
      - { name: c_numeric_10_2, type: float64 }  # the postgres destination has no Decimal128 yet
      - { name: c_bool,         type: bool }
      - { name: c_text,         type: utf8 }
      - { name: c_date,         type: date32 }
      - { name: c_timestamp,    type: timestamp, unit: ms }  # the postgres destination writes ms timestamps

destination:
  type: postgres
  config:
    host: pg
    port: 5432
    dbname: lab
    user: lab
    password: lab
    target_table: type_coverage_sink
    mode: atomic
