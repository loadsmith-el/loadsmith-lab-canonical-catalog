case:
  name: oracle-to-jsonl-parallel-key
  description: >
    A partitioned full load split by a key column (oracle `parallel:
    {workers: 4, split_by: event_sequence}`): ranges of event_sequence at one
    SCN, open at both ends, plus the NULLs, through an alias and a filter.
    Every row exactly once: 60,000 rows.
  tags: [oracle, jsonl, parallel]

services:
  - image: images/lab-oracle
    alias: oracle
    readiness:
      tcp: 1521
      timeout_seconds: 600
      oracle:
        service_name: FREEPDB1
        user: lab
        password: lab
        probe_query: "SELECT 1 FROM user_constraints WHERE constraint_name = 'PK_SINK'"

pipeline:
  file: pipeline.yaml

expect:
  status: success
  rows_read: 60000
  rows_written: 60000
  output:
    file: events.jsonl
    row_count: 60000
