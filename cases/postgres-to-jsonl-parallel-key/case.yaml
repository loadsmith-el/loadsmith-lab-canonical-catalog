case:
  name: postgres-to-jsonl-parallel-key
  description: >
    A partitioned full load split by a key column (postgres `parallel:
    {workers: 4, split_by: event_sequence}`): ranges of event_sequence
    between its minimum and maximum in the snapshot, open at both ends, plus
    the NULLs, through an alias and a filter. Every row exactly once: 60,000
    rows, no duplicate and none missing.
  tags: [postgres, jsonl, parallel]

services:
  - image: images/lab-postgres-15
    alias: pg
    readiness:
      tcp: 5432
      timeout_seconds: 300
      postgres:
        dbname: lab
        user: lab
        password: lab
        probe_query: "SELECT 1 FROM spacecraft_telemetry_events LIMIT 1"

pipeline:
  file: pipeline.yaml

expect:
  status: success
  rows_read: 60000
  rows_written: 60000
  output:
    file: events.jsonl
    row_count: 60000
