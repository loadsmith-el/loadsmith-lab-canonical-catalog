case:
  name: postgres-to-parquet-localcopy-outage
  description: >
    The target goes down mid-delivery on an incremental run: run 1 delivers 2
    Parquet chunks (batches 1-2, rows 1-4000), then every delivery fails
    (local-copy-chaos, LOADSMITH_SINK_FAIL_AFTER) and the run fails. Its
    watermark advances exactly through the delivered files, held back one row
    by the tie-safe rule (3999, since 4000 could continue in the next batch),
    so run 2 (target back) reads the 96,001 rows from 4000 on. Before engine
    1.0.1 the watermark advanced at the destination's commit and run 2 read
    nothing; 1.0.1 kept it where run 1 started and run 2 read all 100k. Needs
    --plugin <canonical-plugins workspace> (the chaos sink is never released).
  tags: [postgres, parquet, sink, incremental, resilience, requires-local-plugin]

services:
  - image: images/lab-postgres-15
    alias: pg
    readiness:
      tcp: 5432
      timeout_seconds: 300
      postgres:
        dbname: lab
        user: lab
        password: lab
        probe_query: "SELECT 1 FROM spacecraft_telemetry_events LIMIT 1"

pipeline:
  file: pipeline.yaml

runs:
  - env:
      - LOADSMITH_SINK_FAIL_AFTER=2
    expect:
      status: error
      logs:
        contains:
          - "advances only through the delivered files"

expect:
  status: success
  rows_read: 96001
  rows_written: 96001
