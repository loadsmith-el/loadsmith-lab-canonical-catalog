case:
  name: oracle-to-jsonl-clob
  description: >
    A CLOB longer than 4000 bytes (8000+ characters, built in the query from
    lob_roundtrip) is read whole: the source fetches CLOBs inline instead of
    through TO_CHAR, which stops at 4000 bytes (ORA-22835).
  tags: [oracle, jsonl, lob]

services:
  - image: images/lab-oracle
    alias: oracle
    readiness:
      tcp: 1521
      timeout_seconds: 600
      oracle:
        service_name: FREEPDB1
        user: lab
        password: lab
        # Gate on the LAST object init.sql creates (the LOB sink PK), so the
        # fixture is fully built before the case connects.
        probe_query: "SELECT 1 FROM user_constraints WHERE constraint_name = 'PK_LOB_SINK'"

pipeline:
  file: pipeline.yaml

expect:
  status: success
  rows_read: 3
  rows_written: 3
  output:
    file: lob.jsonl
    row_count: 3
